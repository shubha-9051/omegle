# docker-compose.prod.yml — used ON THE VPS, pulls prebuilt images
services:
  caddy:
    image: ghcr.io/shubha-9051/omegle-caddy:latest
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - node-backend
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  node-backend:
    image: ghcr.io/shubha-9051/omegle-backend:latest
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - CLIENT_ORIGIN=https://hosteazy.me
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  redis_data: